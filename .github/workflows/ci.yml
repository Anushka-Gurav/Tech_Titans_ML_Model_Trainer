name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main]

jobs:

  # ════════════════════════════════
  # JOB 1 — Backend Lint & Test
  # ════════════════════════════════
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_db

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🔍 Show backend structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== Backend folder ==="
          ls -la backend/ || echo "No backend folder found"

      - name: 📦 Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ No requirements.txt found — installing common packages"
            pip install fastapi uvicorn pymongo pytest pytest-asyncio httpx
          fi
          pip install flake8 pytest pytest-asyncio httpx fastapi
        continue-on-error: true

      - name: 🔍 Lint with flake8
        run: |
          if [ -d backend ]; then
            cd backend
            flake8 . --max-line-length=120 \
              --exclude=__pycache__,tests,venv,.git,migrations \
              --ignore=E501,W503,E302,E303,W291,W293,F401 \
              --statistics
          fi
        continue-on-error: true

      - name: 🧪 Run pytest
        run: |
          if [ -d backend/tests ]; then
            cd backend
            pytest tests/ -v --tb=short
          elif [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "⚠️ No tests directory found — skipping"
          fi
        continue-on-error: true


  # ════════════════════════════════
  # JOB 2 — Frontend Build
  # ════════════════════════════════
  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Show frontend structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== Frontend folder ==="
          ls -la frontend/ || echo "No frontend folder"
          echo "=== Looking for package.json ==="
          find . -name "package.json" -not -path "*/node_modules/*" -not -path "./.git/*"

      - name: 📦 Install frontend dependencies
        run: |
          if [ -f frontend/package.json ]; then
            echo "✅ Found package.json in frontend/"
            cd frontend
            npm install
          elif [ -f package.json ]; then
            echo "✅ Found package.json in root"
            npm install
          else
            echo "❌ No package.json found anywhere"
            exit 1
          fi

      - name: 🏗️ Build React app
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm run build
          elif [ -f package.json ]; then
            npm run build
          fi

      - name: 📂 Confirm build output exists
        run: |
          if [ -d frontend/build ]; then
            echo "✅ Build successful:"
            ls -la frontend/build
          elif [ -d build ]; then
            echo "✅ Build successful:"
            ls -la build
          else
            echo "❌ No build output found"
            exit 1
          fi


  # ════════════════════════════════
  # JOB 3 — Docker Build
  # ════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Check available Docker files
        run: |
          echo "Docker-related files:"
          find . -maxdepth 3 \( -name "Dockerfile" -o -name "docker-compose.yml" \)

      - name: 🔨 Build using docker-compose
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose build

      - name: 🔨 Build backend Docker image
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t ml-backend ./backend

      - name: 🔨 Build frontend Docker image
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t ml-frontend ./frontend

      - name: 📋 Show built images
        run: docker images


  # ════════════════════════════════
  # JOB 4 — Deploy to Render
  # ════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Render deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deploy triggered successfully"
          else
            echo "⚠️ No Render deploy hook configured — skipping"
          fi
