name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════
  #  JOB 1 — Backend Lint & Test
  # ════════════════════════════════
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🔍 Lint with flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 \
            --exclude=__pycache__,tests,venv,.git,migrations \
            --ignore=E501,W503,E302,E303,W291,W293,F401 \
            --statistics
        continue-on-error: true

      - name: 🧪 Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short
        continue-on-error: true

  # ════════════════════════════════
  #  JOB 2 — Frontend Build Check
  # ════════════════════════════════
  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Install frontend dependencies
        run: |
          echo "All folders in root:"
          ls -la
          echo "---"
          # Find where package.json actually is
          FRONTEND_DIR=$(find . -maxdepth 2 -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            | head -1 | xargs dirname)
          echo "Found frontend at: $FRONTEND_DIR"
          cd $FRONTEND_DIR && npm install

      - name: Build React app
        run: |
          FRONTEND_DIR=$(find . -maxdepth 2 -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            | head -1 | xargs dirname)
          cd $FRONTEND_DIR && npm run build
        continue-on-error: true

  # ════════════════════════════════
  #  JOB 3 — Docker Build
  # ════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker images
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose build
          else
            echo "No docker-compose.yml found"
            if [ -f "backend/Dockerfile" ]; then
              docker build -t ml-backend ./backend
            fi
          fi
        continue-on-error: true

  # ════════════════════════════════
  #  JOB 4 — Deploy to Render
  # ════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          else
            echo "No Render deploy hook configured yet — skipping"
          fi
