name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main]

jobs:

  # ════════════════════════════════
  # JOB 1 — Backend Lint & Test
  # ════════════════════════════════
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 (optional)
        run: |
          cd backend
          pip install flake8
          flake8 . --max-line-length=120 \
            --exclude=__pycache__,tests,venv,.git,migrations \
            --ignore=E501,W503,E302,E303,W291,W293,F401 \
            --statistics || true

      - name: Run pytest
        run: |
          cd backend
          pip install pytest pytest-asyncio httpx fastapi
          pytest tests/ -v --tb=short || true


  # ════════════════════════════════
  # JOB 2 — Frontend Build
  # ════════════════════════════════
  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
          else
            echo "No frontend found — skipping"
          fi

      - name: Build frontend
        run: |
          if [ -d frontend ]; then
            cd frontend
            if [ -f package.json ]; then
              npm run build || true
            fi
          fi


  # ════════════════════════════════
  # JOB 3 — Docker Build
  # ════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker-compose (if exists)
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose build
          else
            echo "No docker-compose.yml found"
          fi

      - name: Build backend image
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -t ml-backend ./backend
          else
            echo "No backend Dockerfile"
          fi

      - name: Build frontend image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t ml-frontend ./frontend
          else
            echo "No frontend Dockerfile"
          fi

      - name: Show images
        run: docker images


  # ════════════════════════════════
  # JOB 4 — Deploy
  # ════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "No deploy hook — skipping"
          fi
