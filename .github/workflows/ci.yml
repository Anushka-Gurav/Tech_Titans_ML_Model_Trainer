name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════
  #  JOB 1 — Backend Lint & Test
  # ════════════════════════════════
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 🔍 Lint with flake8 (Static Code Analysis)
        run: |
          cd backend
          flake8 . --max-line-length=100 \
            --exclude=__pycache__,tests,venv,.git \
            --statistics

      - name: 🧪 Run pytest (Unit Tests)
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ════════════════════════════════
  #  JOB 2 — Frontend Build Check
  # ════════════════════════════════
  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Build React app
        run: |
          cd frontend
          npm run build

  # ════════════════════════════════
  #  JOB 3 — Docker Build
  #  (runs only if both CI jobs pass)
  # ════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔨 Build Docker images via Compose
        run: docker-compose build

  # ════════════════════════════════
  #  JOB 4 — Auto Deploy to Render
  #  (runs only on push to main)
  # ════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
