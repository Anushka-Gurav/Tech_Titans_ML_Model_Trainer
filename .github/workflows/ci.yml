name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main]

jobs:

  # ════════════════════════════════
  # JOB 1 — Backend Lint & Test
  # ════════════════════════════════
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_db

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx fastapi

      - name: 🔍 Lint with flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 \
            --exclude=__pycache__,tests,venv,.git,migrations \
            --ignore=E501,W503,E302,E303,W291,W293,F401 \
            --statistics
        continue-on-error: true

      - name: 🧪 Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short
        continue-on-error: true


  # ════════════════════════════════
  # JOB 2 — Frontend Build
  # ════════════════════════════════
  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Locate frontend directory
        id: find-frontend
        run: |
          echo "All files in root:"
          ls -la
          echo "---"

          FRONTEND_DIR=$(find . -maxdepth 2 -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            | head -1 | xargs dirname)

          echo "Found frontend at: $FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> $GITHUB_OUTPUT

      - name: 📦 Install frontend dependencies
        run: |
          cd ${{ steps.find-frontend.outputs.frontend_dir }}
          npm install

      - name: 🏗️ Build React app
        run: |
          cd ${{ steps.find-frontend.outputs.frontend_dir }}
          npm run build

      - name: 📂 Confirm build output exists
        run: |
          FRONTEND_DIR=${{ steps.find-frontend.outputs.frontend_dir }}
          if [ -d "$FRONTEND_DIR/build" ]; then
            echo "✅ Build folder found:"
            ls -la "$FRONTEND_DIR/build"
          else
            echo "❌ Build folder not found — something went wrong"
            exit 1
          fi


  # ════════════════════════════════
  # JOB 3 — Docker Build
  # ════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Check available Docker files
        run: |
          echo "Project structure:"
          find . -maxdepth 3 \( -name "Dockerfile" -o -name "docker-compose.yml" \)

      - name: 🔨 Build using docker-compose
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose build

      - name: 🔨 Build backend Docker image
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t ml-backend ./backend

      - name: 🔨 Build frontend Docker image
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t ml-frontend ./frontend

      - name: 📋 Show built images
        run: docker images


  # ════════════════════════════════
  # JOB 4 — Deploy to Render
  # ════════════════════════════════
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Render deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deploy triggered successfully"
          else
            echo "⚠️ No Render deploy hook configured — skipping"
          fi
