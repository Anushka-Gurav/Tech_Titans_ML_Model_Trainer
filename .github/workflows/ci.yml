name: CI/CD Pipeline — ML Model Trainer

on:
  push:
    branches: [main, develop, feature, new_feature]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        working-directory: backend
        run: |
          flake8 . --max-line-length=120 \
            --exclude=__pycache__,tests,venv,.git,migrations \
            --ignore=E501,W503,E302,E303,W291,W293,F401 \
            --statistics
        continue-on-error: true

      - name: Run pytest
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true

  frontend-ci:
    name: ⚛️ Frontend — Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          FRONTEND_DIR=$(find . -maxdepth 2 -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            | head -1 | xargs dirname)

          echo "Frontend found at: $FRONTEND_DIR"
          cd "$FRONTEND_DIR"
          npm install

      - name: Build React app
        run: |
          FRONTEND_DIR=$(find . -maxdepth 2 -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            | head -1 | xargs dirname)

          cd "$FRONTEND_DIR"
          npm run build
        continue-on-error: true

  docker-build:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build using docker-compose
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose build

      - name: Build backend Docker image
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t ml-backend ./backend

      - name: Build frontend Docker image
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t ml-frontend ./frontend

      - name: Show built images
        run: docker images

  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "No Render deploy hook configured yet — skipping"
          fi
